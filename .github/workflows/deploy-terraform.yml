name: Deploy Infrastructure & Lambda

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "terraform/**"
      - "lambda/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "terraform/**"
      - "lambda/**"

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.9.0"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_BACKEND_BUCKET: ${{ secrets.AWS_ACCOUNT_ID }}-jyjulianwong-ina-terraform-state
          TF_BACKEND_TABLE:  jyjulianwong-ina-terraform-lock
        run: |
          terraform init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="dynamodb_table=$TF_BACKEND_TABLE"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="tavily_api_key=${{ secrets.TAVILY_API_KEY }}" \
            -var="email_imap_username=${{ secrets.EMAIL_IMAP_USERNAME }}" \
            -var="email_imap_app_password=${{ secrets.EMAIL_IMAP_APP_PASSWORD }}" \
            -var="client_github_pages_origin=${{ secrets.CLIENT_GITHUB_PAGES_ORIGIN }}" \
            -var="llm_provider=${{ vars.LLM_PROVIDER || 'openrouter' }}" \
            -var="openrouter_model=${{ vars.OPENROUTER_MODEL || 'google/gemini-3-flash-preview' }}" \
            -var="openai_model=${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}" \
            -var="openai_reasoning_effort=${{ vars.OPENAI_REASONING_EFFORT || '' }}" \
            -var="email_provider=${{ vars.EMAIL_PROVIDER || 'imap' }}" \
            -var="email_imap_host=${{ vars.EMAIL_IMAP_HOST || 'imap.gmail.com' }}" \
            -var="email_imap_port=${{ vars.EMAIL_IMAP_PORT || '993' }}" \
            -var="email_imap_folder=${{ vars.EMAIL_IMAP_FOLDER || 'Newsletters' }}" \
            -var="email_newsletter_senders=${{ vars.EMAIL_NEWSLETTER_SENDERS || 'brewmarkets@morningbrew.com,FT@news-alerts.ft.com:3,noreply@newsletter.thetimes.com:2,noreply@newsletter.thetimes.co.uk:2' }}" \
            -var="email_newsletter_default_fetch_count=${{ vars.EMAIL_NEWSLETTER_DEFAULT_FETCH_COUNT || '1' }}" \
            -var="web_search_providers=${{ vars.WEB_SEARCH_PROVIDERS || 'tavily,ddgs' }}" \
            -var="tavily_max_results=${{ vars.TAVILY_MAX_RESULTS || '10' }}" \
            -var="tavily_search_depth=${{ vars.TAVILY_SEARCH_DEPTH || 'advanced' }}" \
            -var="tavily_topic=${{ vars.TAVILY_TOPIC || 'news' }}" \
            -var="tavily_include_domains=${{ vars.TAVILY_INCLUDE_DOMAINS || 'reuters.com,apnews.com,cnbc.com,marketwatch.com,investing.com,tradingeconomics.com,federalreserve.gov,bis.org,imf.org,finance.yahoo.com,theguardian.com' }}" \
            -var="tavily_search_workers=${{ vars.TAVILY_SEARCH_WORKERS || '5' }}" \
            -var="ddgs_max_results=${{ vars.DDGS_MAX_RESULTS || '10' }}" \
            -var="evaluator_min_results=${{ vars.EVALUATOR_MIN_RESULTS || '5' }}" \
            -var="evaluator_min_domains=${{ vars.EVALUATOR_MIN_DOMAINS || '3' }}" \
            -var="market_data_max_tool_calls=${{ vars.MARKET_DATA_MAX_TOOL_CALLS || '8' }}" \
            -no-color \
            -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planOutput = '${{ steps.terraform-plan.outputs.stdout }}'.slice(0, 60000);
            const body = `### Terraform Plan\n\`\`\`\n${planOutput}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  version_bump:
    name: Calendar Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bump calver and tag
        id: bump
        run: python3 scripts/bump_calver.py

      - name: Push commit and tag
        run: git push origin HEAD:main --tags

  deploy:
    name: Terraform Apply + Lambda Deploy
    needs: [version_bump]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version_bump.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Terraform apply
      # -----------------------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_BACKEND_BUCKET: ${{ secrets.AWS_ACCOUNT_ID }}-jyjulianwong-ina-terraform-state
          TF_BACKEND_TABLE:  jyjulianwong-ina-terraform-lock
        run: |
          terraform init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="dynamodb_table=$TF_BACKEND_TABLE"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="tavily_api_key=${{ secrets.TAVILY_API_KEY }}" \
            -var="email_imap_username=${{ secrets.EMAIL_IMAP_USERNAME }}" \
            -var="email_imap_app_password=${{ secrets.EMAIL_IMAP_APP_PASSWORD }}" \
            -var="client_github_pages_origin=${{ secrets.CLIENT_GITHUB_PAGES_ORIGIN }}" \
            -var="llm_provider=${{ vars.LLM_PROVIDER || 'openrouter' }}" \
            -var="openrouter_model=${{ vars.OPENROUTER_MODEL || 'google/gemini-3-flash-preview' }}" \
            -var="openai_model=${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}" \
            -var="openai_reasoning_effort=${{ vars.OPENAI_REASONING_EFFORT || '' }}" \
            -var="email_provider=${{ vars.EMAIL_PROVIDER || 'imap' }}" \
            -var="email_imap_host=${{ vars.EMAIL_IMAP_HOST || 'imap.gmail.com' }}" \
            -var="email_imap_port=${{ vars.EMAIL_IMAP_PORT || '993' }}" \
            -var="email_imap_folder=${{ vars.EMAIL_IMAP_FOLDER || 'Newsletters' }}" \
            -var="email_newsletter_senders=${{ vars.EMAIL_NEWSLETTER_SENDERS || 'brewmarkets@morningbrew.com,FT@news-alerts.ft.com:3,noreply@newsletter.thetimes.com:2,noreply@newsletter.thetimes.co.uk:2' }}" \
            -var="email_newsletter_default_fetch_count=${{ vars.EMAIL_NEWSLETTER_DEFAULT_FETCH_COUNT || '1' }}" \
            -var="web_search_providers=${{ vars.WEB_SEARCH_PROVIDERS || 'tavily,ddgs' }}" \
            -var="tavily_max_results=${{ vars.TAVILY_MAX_RESULTS || '10' }}" \
            -var="tavily_search_depth=${{ vars.TAVILY_SEARCH_DEPTH || 'advanced' }}" \
            -var="tavily_topic=${{ vars.TAVILY_TOPIC || 'news' }}" \
            -var="tavily_include_domains=${{ vars.TAVILY_INCLUDE_DOMAINS || 'reuters.com,apnews.com,cnbc.com,marketwatch.com,investing.com,tradingeconomics.com,federalreserve.gov,bis.org,imf.org,finance.yahoo.com,theguardian.com' }}" \
            -var="tavily_search_workers=${{ vars.TAVILY_SEARCH_WORKERS || '5' }}" \
            -var="ddgs_max_results=${{ vars.DDGS_MAX_RESULTS || '10' }}" \
            -var="evaluator_min_results=${{ vars.EVALUATOR_MIN_RESULTS || '5' }}" \
            -var="evaluator_min_domains=${{ vars.EVALUATOR_MIN_DOMAINS || '3' }}" \
            -var="market_data_max_tool_calls=${{ vars.MARKET_DATA_MAX_TOOL_CALLS || '8' }}" \
            -auto-approve \
            -no-color

      - name: Read Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "lambda_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Build & push Lambda container image
      # -----------------------------------------------------------------------

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Lambda image
        env:
          ECR_URL: ${{ steps.tf_outputs.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
          INA_VERSION: ${{ needs.version_bump.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --build-arg INA_VERSION="$INA_VERSION" \
            -t "$ECR_URL:$IMAGE_TAG" \
            -t "$ECR_URL:latest" \
            lambda/

      # -----------------------------------------------------------------------
      # Update Lambda to use the new image
      # -----------------------------------------------------------------------

      - name: Update Lambda function code
        env:
          ECR_URL:      ${{ steps.tf_outputs.outputs.ecr_url }}
          LAMBDA_NAME:  ${{ steps.tf_outputs.outputs.lambda_name }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --image-uri "$ECR_URL:$IMAGE_TAG" \
            --region "$AWS_REGION"
